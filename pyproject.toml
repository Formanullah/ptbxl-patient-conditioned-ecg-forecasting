[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptbxl-patient-forecasting"
version = "0.1.0"
description = "Patient-isolated, contrastive 12-lead PTB-XL waveform forecasting"
requires-python = ">=3.11"
dependencies = ["torch>=2.1", "numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "wfdb>=4.1", "PyYAML>=6", "filelock>=3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
