[project]
name = "ptbxl-forecast"
version = "0.1.0"
description = "Reproducible, leakage-free 12-lead ECG forecasting on PTB-XL (7 s -> 3 s, 100 Hz)"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.13,<2",
    "pandas>=2.2,<4",
    "matplotlib>=3.9,<4",
    "wfdb>=4.1,<6",
    "omegaconf>=2.3,<3",
    "neurokit2>=0.2.10,<1",  # R-peak detection for beat/rhythm metrics (Phase 6)
    "numba>=0.60,<1",  # banded DTW metric
    "scikit-learn>=1.5,<2",  # ridge reference learner, PCA (Phase 5)
    "PyWavelets>=1.6,<2",  # wavelet denoising candidate (Phase 5)
]

[project.optional-dependencies]
# Pick exactly one torch build. All three pin the same torch version so that CPU and
# GPU runs use identical library code. 2.14.1 is the newest release with CUDA 12 wheels.
cpu = ["torch==2.14.1"]
cu126 = ["torch==2.14.1"] # NVIDIA driver >= 525 (CUDA 12 minor-version compatibility)
cu130 = ["torch==2.14.1"] # NVIDIA driver >= 580, needed for the newest GPUs
tracking = ["mlflow>=3.5,<4"]

[project.scripts]
ptbxl-forecast = "ptbxl_forecast.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.15,<1"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest"
addopts = "--basetemp=.cache/test-temp"

[tool.ruff]
line-length = 100
target-version = "py311"
cache-dir = ".cache/ruff"
extend-exclude = ["archive", "research/phase1_benchmarks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
