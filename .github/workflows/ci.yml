name: lint-and-test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install locked environment (CPU torch, MLflow)
        run: uv sync --locked --extra cpu --extra tracking
      - run: uv run --locked ruff check src tests research scripts
      - run: uv run --locked ruff format --check src tests research scripts
      - run: uv run --locked pytest -q
      - run: uv run --locked ptbxl-forecast config
